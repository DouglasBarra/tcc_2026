# SQL Server 2022 Developer para os experimentos do TCC.
# Variaveis vem do arquivo .env (copie de .env.example).
services:
  sqlserver:
    # Imagem FIXADA por digest (decisao 10 do autor). Em 04/10/2026 as tags 2022-latest e
    # 2022-CU27-ubuntu-22.04 apontavam para este mesmo digest (amd64, SQL Server 16.0.4295.3 RTM-CU27).
    # Antes: image: mcr.microsoft.com/mssql/server:2022-latest
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    # Apple Silicon: imagem so existe para amd64 (emulada via Rosetta/QEMU).
    # Em maquina x86_64 ou Windows/Linux amd64 esta linha e inofensiva.
    platform: linux/amd64
    container_name: tcc-sqlserver
    hostname: tcc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-4096}
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - tcc_sqlserver_data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 15s   # o SIGTERM nao desliga o SQL Server sob emulacao (virava SIGKILL/137); down.sh usa SHUTDOWN antes
    restart: "no"

volumes:
  tcc_sqlserver_data:
    name: tcc_sqlserver_data
