    <script>
      /* aplica o tema antes da pintura para evitar flash; falha de storage nao pode quebrar a pagina */
      try {
        var t = localStorage.getItem('tcclab.tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
