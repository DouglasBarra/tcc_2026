# Conjunto de VALIDACAO do Diagnostico, separado do desenvolvimento das regras.
# Escrito e rotulado em 25/10/2026 ANTES de qualquer execucao do detector sobre ele; o hash SHA-256 deste arquivo e o de
# diagnostico.py foram registrados em PRE-REGISTRO.md antes de gerar os planos. Nao ajustar regras olhando estes resultados
# sem declarar que o conjunto deixou de ser de validacao.
#
# Rotulos (por consulta):
#   esperado = classes que o detector DEVE apontar
#   tolerado = classes que podem aparecer sem contar como falso positivo (a varredura por falta de indice acompanha varias)
#   proibido = classes que NAO podem aparecer (casos construidos para enganar uma regra)
# Mesmo formato do catalogo.toml (campos obrigatorios de consulta), mais as tres listas.

[meta]
versao = 1
banco = "so_exp"
dataset = "StackOverflow2010"

[[consulta]]
id = "H1"
antipadrao = "AP1"
titulo = "LEFT sobre DisplayName"
tabelas = ["dbo.Users"]
seletividade = "alta"
papel = "validacao"
esperado = ["AP1"]
tolerado = ["AP4"]
proibido = ["AP2", "AP3"]
sql_original = """SELECT Id FROM dbo.Users WHERE LEFT(DisplayName, 4) = 'Jon '"""

