indice_original = "CREATE INDEX ix_exp_posts_owner ON dbo.Posts (OwnerUserId)"
indice = "CREATE INDEX ix_exp_posts_owner_cob ON dbo.Posts (OwnerUserId) INCLUDE (Score, CreationDate)"

