[[consulta]]
id = "C1"
antipadrao = "AP3"
titulo = "SELECT * em Posts por OwnerUserId (11.354 linhas, 0,3%)"
tabelas = ["dbo.Posts"]
seletividade = "alta"
sql_original = """SELECT * FROM dbo.Posts WHERE OwnerUserId = 22656"""
sql_reescrita = """SELECT Id, Score, CreationDate FROM dbo.Posts WHERE OwnerUserId = 22656"""
sql_equivalencia = """SELECT Id, Score, CreationDate FROM (SELECT * FROM dbo.Posts WHERE OwnerUserId = 22656) AS t"""
indice_original = "CREATE INDEX ix_exp_posts_owner ON dbo.Posts (OwnerUserId)"
indice = "CREATE INDEX ix_exp_posts_owner_cob ON dbo.Posts (OwnerUserId) INCLUDE (Score, CreationDate)"

